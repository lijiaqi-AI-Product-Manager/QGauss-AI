services:
  postgres:
    image: postgres:17-alpine
    container_name: qgauss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qgauss
      POSTGRES_PASSWORD: qgauss
      POSTGRES_DB: qgauss
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - qgauss-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qgauss -d qgauss"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qgauss-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - qgauss-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qgauss-pgdata:
  qgauss-redisdata:
