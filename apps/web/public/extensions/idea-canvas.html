<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QGauss AI · 灵感便签</title><link rel="stylesheet" href="/extensions/idea-canvas.css"></head><body><main><header><span class="wordmark">QGauss <i>✳</i></span><button id="theme" type="button" aria-label="切换便签主题">◐</button></header><section class="intro"><span>SMALL IDEA, OPEN SKY</span><h1>让小念头，<br><em>长出新可能。</em></h1><p>先留下一点想法，再和创作搭档一起展开。</p><div class="little-world" aria-hidden="true"><i></i><i></i><b>✦</b></div></section><section class="note"><div class="note-heading"><label for="idea">今天想做点什么？</label><span id="count">0 / 3000</span></div><textarea id="idea" maxlength="3000" placeholder="例如：想做一份周末城市散步计划，有书店、咖啡和一点偶遇……"></textarea><div class="tone" role="group" aria-label="展开方式"><button type="button" data-tone="plan" aria-pressed="true">✦ 变成行动计划</button><button type="button" data-tone="ideas" aria-pressed="false">↗ 多想几个点子</button><button type="button" data-tone="words" aria-pressed="false">◡ 写成一段好文字</button></div><footer><span id="saved">草稿会保留在当前账号的此窗口中</span><button id="ask" type="button" disabled>和创作搭档聊聊 <b>↗</b></button></footer></section><p id="status" role="status">正在连接工作台…</p><section id="answer-panel" hidden><header><span>新的可能，接住了。</span><button id="copy" type="button">复制文字</button></header><pre id="answer"></pre></section></main><script src="/extensions/qgauss-bridge.js"></script><script src="/extensions/idea-canvas.js"></script></body></html>
