name: QGauss quality

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_PORT: '9521'
      FAKE_PORT: '9901'
      DATABASE_URL: file:./dev.db
      NODE_ENV: test
      MAIL_SMTP_HOST: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare isolated development data
        shell: bash
        run: |
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          printf 'APP_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          npm run prisma:generate -w @qgauss/api
          npm run db:init
          npm run seed
      - run: npm run verify
      - run: npm run verify:compose
